name: OpenXdrive verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  brand-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no legacy brand paths or content remain
        shell: bash
        run: |
          if git ls-files | grep -iE '9[ _-]*drive'; then
            echo 'Legacy brand remains in a tracked path'
            exit 1
          fi
          if git grep -n -iE '9[ _-]*drive' -- .; then
            echo 'Legacy brand remains in tracked file contents'
            exit 1
          fi
      - name: Check private configuration and asset dependencies
        shell: bash
        run: |
          if git ls-files --error-unmatch frontend/.env >/dev/null 2>&1; then
            echo "A local frontend environment file is tracked"
            exit 1
          fi
          if git grep -n -E 'pravatar\\.cc|api\\.dicebear\\.com|www\\.gravatar\\.com' -- frontend/src; then
            echo "A third-party demo avatar dependency remains"
            exit 1
          fi
          node -e "const fs=require('fs'); for(const part of ['frontend','backend']) { const p=JSON.parse(fs.readFileSync(part+'/package.json')); const l=JSON.parse(fs.readFileSync(part+'/package-lock.json')); if(p.name!=='openxdrive-'+part || l.name!==p.name || l.packages[''].name!==p.name) process.exit(1) }"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Audit backend production dependencies
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Record Ant Design dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(frontend): lock Ant Design 6 dependencies'
            git push origin HEAD:"$HEAD_BRANCH"
          fi
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend production dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
